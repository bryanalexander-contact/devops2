name: CI/CD Innovatech Chile

on:
  push:
    branches:
      - deploy

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Loguearse en Docker Hub para cumplir la rúbrica de publicación
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construir y publicar las imágenes con versionamiento automático (etiqueta 'latest')
      - name: Build and Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:latest ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:latest

      - name: Build and Push Backend 1
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend1:latest ./backend1
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend1:latest

      - name: Build and Push Backend 2
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend2:latest ./backend2
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend2:latest

  deploy-to-ec2:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Copiar solo el docker-compose.yml al servidor de Amazon Linux
      - name: Copy docker-compose via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/ec2-user"

      # Conectarse a la EC2, descargar las imágenes nuevas de Docker Hub y encender todo
      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ec2-user
            # Modificar el docker-compose en caliente para usar las imágenes de Docker Hub
            sed -i 's|build: ./frontend|image: '${{ secrets.DOCKERHUB_USERNAME }}'/innovatech-frontend:latest|g' docker-compose.yml
            sed -i 's|build: ./backend1|image: '${{ secrets.DOCKERHUB_USERNAME }}'/innovatech-backend1:latest|g' docker-compose.yml
            sed -i 's|build: ./backend2|image: '${{ secrets.DOCKERHUB_USERNAME }}'/innovatech-backend2:latest|g' docker-compose.yml
            
            # En Amazon Linux se ejecuta con guion intermedio 'docker-compose'
            /usr/local/bin/docker-compose down || true
            /usr/local/bin/docker-compose pull
            /usr/local/bin/docker-compose up -d